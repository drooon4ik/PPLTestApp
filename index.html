<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL — Экзамен</title>
<style>
  :root {
    --bg: #0f1720; --card: #1b2733; --card2: #223140;
    --text: #e6edf3; --muted: #8b98a5; --accent: #3b82f6;
    --ok: #22c55e; --bad: #ef4444; --border: #2d3b49;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px;
  }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title { font-weight: 700; font-size: 16px; }
  .spacer { flex: 1; }
  .progress-wrap { width: 100%; height: 6px; background: var(--card2); border-radius: 6px; margin-top: 10px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 6px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .qmeta { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { background: var(--card2); padding: 2px 8px; border-radius: 20px; }
  .qtext { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .answer {
    display: block; width: 100%; text-align: left;
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 14px; border-radius: 10px; margin-bottom: 10px; font-size: 15px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .answer:hover { border-color: var(--accent); }
  .answer.correct { background: rgba(34,197,94,.15); border-color: var(--ok); }
  .answer.wrong { background: rgba(239,68,68,.15); border-color: var(--bad); }
  .answer:disabled { cursor: default; }
  .explanation {
    background: var(--card2); border-left: 3px solid var(--accent);
    padding: 12px 14px; border-radius: 8px; margin-top: 12px; font-size: 14px; color: #cdd9e5; display: none;
  }
  .explanation.show { display: block; }
  .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button.btn {
    background: var(--accent); color: #fff; border: none; padding: 12px 18px;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; flex: 1; min-width: 120px;
  }
  button.btn.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  select { background: var(--card2); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .lang-switch { display: flex; gap: 4px; }
  .flag {
    background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 8px; font-size: 18px; line-height: 1; cursor: pointer; opacity: .45;
    transition: opacity .15s, border-color .15s, transform .1s;
  }
  .flag:hover { opacity: .8; }
  .flag.active { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .flag:active { transform: scale(.92); }
  .done-screen { text-align: center; padding: 32px 16px; }
  .done-screen h2 { font-size: 26px; margin: 6px 0; }
  /* Список тем на стартовом экране */
  .topic-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card2); margin-bottom: 8px;
  }
  .topic-item:hover { border-color: var(--accent); }
  .topic-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .topic-item.sub { margin-left: 22px; background: var(--bg); }
  .topic-item .st { font-size: 16px; }
  .topic-item .nm { font-weight: 600; }
  .topic-item .gd { font-size: 12px; color: var(--muted); }
  .section-label { font-size: 13px; color: var(--muted); margin: 14px 2px 8px; }
  /* Закреплённая нижняя панель запуска экзамена */
  .start-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 16px;
    box-shadow: 0 -6px 18px rgba(0,0,0,.35);
  }
  .start-footer .inner { max-width: 720px; margin: 0 auto; }
  .start-footer .sel { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .start-footer .sel b { color: var(--text); }
  /* когда виден стартовый футер — снизу у main запас, чтобы он не перекрывал контент */
  body.has-footer main { padding-bottom: 120px; }
  /* Оверлей истории */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.55); align-items: stretch; justify-content: flex-end;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--card); width: 100%; max-width: 460px; height: 100%;
    display: flex; flex-direction: column; border-left: 1px solid var(--border);
  }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .panel-head strong { flex: 1; }
  .panel-list { overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  .hitem {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; border-left-width: 3px;
  }
  .hitem:hover { background: var(--card2); }
  .hitem.ok { border-left-color: var(--ok); }
  .hitem.bad { border-left-color: var(--bad); }
  .hitem .qt { font-size: 13px; color: var(--text); }
  .hitem .gd { font-size: 11px; color: var(--muted); }
  .hitem .st { font-size: 15px; }
  .hempty { color: var(--muted); font-size: 14px; padding: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title">PPL Экзамен</span>
    <span class="spacer"></span>
    <button class="btn secondary" id="histBtn" style="flex:0; min-width:auto; padding:6px 12px; font-size:13px;">📋 История</button>
    <div class="lang-switch" id="langSwitch">
      <button class="flag" data-lang="en" title="English">🇬🇧</button>
      <button class="flag" data-lang="ru" title="Русский">🇷🇺</button>
      <button class="flag" data-lang="pl" title="Polski">🇵🇱</button>
    </div>
    <button class="btn secondary" id="resetBtn" style="flex:0; min-width:auto; padding:6px 12px; font-size:13px;">Сброс</button>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="stats" id="stats"></div>
  <div class="stats" id="overallStats" style="color:#93c5fd; font-weight:600;"></div>
</header>
<main id="main">
  <div class="card"><div class="qtext">Загрузка…</div></div>
</main>
<div id="startFooter"></div>

<div class="overlay" id="histOverlay">
  <div class="panel">
    <div class="panel-head">
      <strong id="histTitle">История ответов</strong>
      <button class="btn secondary" id="closeHistBtn" style="flex:0; min-width:auto; padding:4px 10px;">✕</button>
    </div>
    <div class="panel-list" id="histList"></div>
  </div>
</div>

<script>
const LS_KEY = 'ppl_progress_v1';
const EXAM_SIZE = 24;     // вопросов в сессии
const EXAM_PASS = 0.75;   // проходной балл 75%

let DATA = null;
let byId = {};
let clusters = {};        // cluster_id -> [question_id...]
let lang = localStorage.getItem('ppl_lang') || 'ru';
let currentTopic = localStorage.getItem('ppl_topic') || 'ALL';
let currentSubtopic = localStorage.getItem('ppl_subtopic') || 'ALL';
let progress = {};

// состояние экзамена
let examQueue = [];
let examIdx = 0;
let examCorrect = 0;
let examAnswers = {};
let current = null;

const PROGRESS_API = '/api/progress';

// Загрузка прогресса с сервера. Если сервер недоступен — берём из localStorage (запасной вариант).
async function loadProgress() {
  try {
    const res = await fetch(PROGRESS_API, { cache: 'no-store' });
    if (!res.ok) { throw new Error('HTTP ' + res.status); }
    const data = await res.json();
    return (data && typeof data === 'object') ? data : {};
  } catch (e) {
    console.warn('Не удалось загрузить прогресс с сервера, использую localStorage:', e);
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) { return {}; }
  }
}

let _saveTimer = null;
// Сохранение прогресса на сервер (с небольшой задержкой, чтобы не спамить запросами).
// Дублируем в localStorage как запасную копию.
function saveProgress() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (_) {}
  if (_saveTimer) { clearTimeout(_saveTimer); }
  _saveTimer = setTimeout(saveProgressNow, 300);
}

async function saveProgressNow() {
  try {
    const res = await fetch(PROGRESS_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(progress)
    });
    if (!res.ok) { throw new Error('HTTP ' + res.status); }
  } catch (e) {
    console.warn('Не удалось сохранить прогресс на сервере (осталась копия в localStorage):', e);
  }
}
function t(obj) { return (obj && (obj[lang] || obj.pl || obj.ru || obj.en)) || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function init() {
  progress = await loadProgress();
  const res = await fetch('study_data.json');
  DATA = await res.json();
  byId = {}; clusters = {};
  for (const q of DATA.questions) {
    byId[q.question_id] = q;
    (clusters[q.cluster_id] = clusters[q.cluster_id] || []).push(q.question_id);
  }
  updateLangButtons();
  showStart();
}

function inTopic(q) {
  if (currentTopic !== 'ALL' && q.topic_code !== currentTopic) return false;
  if (currentSubtopic !== 'ALL' && q.subtopic !== currentSubtopic) return false;
  return true;
}

// прогресс по набору представителей: сколько верно отвечено
function progFor(filterFn) {
  const reps = DATA.questions.filter(q => q.is_representative && filterFn(q));
  let known = 0;
  for (const q of reps) { const p = progress[q.question_id]; if (p && p.correct) known++; }
  return { total: reps.length, known };
}

// Общий трекинг по текущей выбранной теме/подтеме (сколько всего пройдено верно).
function overallProgress() {
  return progFor(q => inTopic(q));
}
function updateOverall() {
  const el = document.getElementById('overallStats');
  if (!el) return;
  const p = overallProgress();
  const pct = p.total ? Math.round(100 * p.known / p.total) : 0;
  el.textContent = `📊 Всего по «${topicLabel()}»: пройдено ${p.known}/${p.total} (${pct}%)`;
}

/* ---------- Стартовый экран: выбор темы ---------- */
function showStart() {
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('stats').textContent = 'Выберите тему и начните экзамен (24 вопроса)';
  updateOverall();

  const topics = DATA.meta.topics || [];
  const allP = progFor(() => true);

  let html = `<div class="card">
    <div class="qtext">📝 Экзаменационный режим</div>
    <p style="color:var(--muted); font-size:14px; margin-top:-6px;">
      ${EXAM_SIZE} вопросов из выбранной темы. Проходной балл — ${Math.round(EXAM_PASS*100)}%
      (${Math.ceil(EXAM_PASS*EXAM_SIZE)} из ${EXAM_SIZE}).
      Каждая сессия сначала подкидывает вопросы, где вы ошиблись или которые ещё не видели.</p>

    <div class="section-label">Тема экзамена</div>`;

  // "Все темы"
  html += topicRow('ALL', '🌐', 'Все темы', `${allP.known}/${allP.total} изучено · ${DATA.meta.total_questions} вопросов`,
                   currentTopic === 'ALL');

  topics.forEach(tp => {
    const p = progFor(q => q.topic_code === tp.code);
    const pct = tp.representatives ? Math.round(100*p.known/tp.representatives) : 0;
    const activeTopic = currentTopic === tp.code;
    html += topicRow(tp.code, pct===100?'✅':'📘', tp.name,
                     `учить ${tp.representatives} · изучено ${p.known} (${pct}%)`,
                     activeTopic && currentSubtopic === 'ALL');
    // подтемы, если тема выбрана
    if (tp.subtopics && activeTopic) {
      html += subRow('ALL', '▪', 'Все подтемы', '', currentSubtopic === 'ALL');
      tp.subtopics.forEach(st => {
        const sp = progFor(q => q.topic_code === tp.code && q.subtopic === st.name);
        const spct = st.representatives ? Math.round(100*sp.known/st.representatives) : 0;
        html += subRow(st.name, spct===100?'✅':'◦', st.name,
                       `учить ${st.representatives} · изучено ${sp.known} (${spct}%)`,
                       currentSubtopic === st.name);
      });
    }
  });

  const label = topicLabel();
  const poolSize = DATA.questions.filter(q => q.is_representative && inTopic(q)).length;
  html += `</div>`;

  document.getElementById('main').innerHTML = html;

  // Закреплённая нижняя панель с кнопкой запуска — всегда видна
  document.body.classList.add('has-footer');
  document.getElementById('startFooter').innerHTML = `
    <div class="start-footer">
      <div class="inner">
        <div class="sel">Выбрано: <b>${escapeHtml(label)}</b> · вопросов в пуле: ${poolSize}</div>
        <button class="btn" onclick="startExam()">Начать экзамен (${EXAM_SIZE} вопросов)</button>
      </div>
    </div>`;
}

function topicRow(code, icon, name, sub, active) {
  const c = String(code).replace(/'/g, "\\'");
  return `<div class="topic-item ${active?'active':''}" onclick="selectTopic('${c}')">
      <span class="st">${icon}</span>
      <span><div class="nm">${escapeHtml(name)}</div><div class="gd">${escapeHtml(sub)}</div></span>
    </div>`;
}
function subRow(name, icon, label, sub, active) {
  const n = String(name).replace(/'/g, "\\'");
  return `<div class="topic-item sub ${active?'active':''}" onclick="selectSubtopic('${n}')">
      <span class="st">${icon}</span>
      <span><div class="nm">${escapeHtml(label)}</div>${sub?`<div class="gd">${escapeHtml(sub)}</div>`:''}</span>
    </div>`;
}

function selectTopic(code) {
  currentTopic = code; currentSubtopic = 'ALL';
  localStorage.setItem('ppl_topic', code);
  localStorage.setItem('ppl_subtopic', 'ALL');
  showStart();
}
function selectSubtopic(name) {
  currentSubtopic = name;
  localStorage.setItem('ppl_subtopic', name);
  showStart();
}

function topicLabel() {
  if (currentTopic === 'ALL') return 'Все темы';
  const tp = (DATA.meta.topics || []).find(x => x.code === currentTopic);
  let base = tp ? tp.name : currentTopic;
  if (currentSubtopic !== 'ALL') base += ' › ' + currentSubtopic;
  return base;
}

/* ---------- Формирование набора ---------- */
// приоритет внутри группы: 1) ошибался, 2) не видел, 3) отвечал верно
function priorityTiers(qids) {
  const wrong = [], unseen = [], known = [];
  for (const qid of qids) {
    const p = progress[qid];
    if (!p || (!p.correct && !p.wrong)) unseen.push(qid);
    else if (!p.correct) wrong.push(qid);
    else known.push(qid);
  }
  shuffle(wrong); shuffle(unseen); shuffle(known);
  return [...wrong, ...unseen, ...known];
}

function buildExam() {
  const reps = DATA.questions.filter(q => q.is_representative && inTopic(q));
  const topicMeta = (DATA.meta.topics || []).find(x => x.code === currentTopic);
  const useStrata = topicMeta && topicMeta.subtopics && currentSubtopic === 'ALL';

  if (!useStrata) {
    return priorityTiers(reps.map(q => q.question_id)).slice(0, EXAM_SIZE);
  }
  // равномерно по подтемам (как на реальном экзамене), приоритет внутри
  const bySub = {};
  for (const q of reps) (bySub[q.subtopic] = bySub[q.subtopic] || []).push(q.question_id);
  const queues = shuffle(Object.keys(bySub)).map(n => priorityTiers(bySub[n]));
  const picked = [];
  let added = true;
  while (picked.length < EXAM_SIZE && added) {
    added = false;
    for (const q of queues) {
      if (picked.length >= EXAM_SIZE) break;
      if (q.length) { picked.push(q.shift()); added = true; }
    }
  }
  return picked;
}

/* ---------- Экзамен ---------- */
function startExam() {
  examQueue = buildExam();
  if (examQueue.length === 0) { alert('В выбранной теме нет вопросов.'); return; }
  examIdx = 0; examCorrect = 0; examAnswers = {};
  renderExam();
}

function renderExam() {
  const main = document.getElementById('main');
  const total = examQueue.length;
  document.getElementById('startFooter').innerHTML = '';
  document.body.classList.remove('has-footer');

  if (examIdx >= total) {
    const pct = Math.round(100 * examCorrect / total);
    const passed = examCorrect / total >= EXAM_PASS;
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('stats').textContent = `Экзамен завершён: ${examCorrect}/${total} (${pct}%)`;
    updateOverall();
    main.innerHTML = `<div class="card done-screen">
        <h2>${passed ? '✅ Сдано!' : '❌ Не сдано'}</h2>
        <p style="font-size:24px; font-weight:800;">${examCorrect} / ${total} — ${pct}%</p>
        <p style="color:var(--muted);">Тема: ${escapeHtml(topicLabel())} · проходной ${Math.round(EXAM_PASS*100)}% (${Math.ceil(EXAM_PASS*total)}/${total})</p>
        <div class="controls" style="justify-content:center;">
          <button class="btn" onclick="startExam()">Ещё сессия (${total} вопросов)</button>
          <button class="btn secondary" onclick="showStart()">Сменить тему</button>
        </div>
        <p style="color:var(--muted); font-size:13px; margin-top:16px;">
          Следующая сессия подкинет прежде всего вопросы, где вы ошиблись или которые ещё не видели.</p>
      </div>`;
    return;
  }

  const qid = examQueue[examIdx];
  current = byId[qid];
  const q = current;
  const chosen = examAnswers[q.question_id];

  const pct = Math.round(100 * examIdx / total);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('stats').textContent =
    `📝 ${topicLabel()} · вопрос ${examIdx + 1} из ${total} · верных: ${examCorrect}`;
  updateOverall();

  const answersHtml = q.answers.map(a =>
    `<button class="answer" data-id="${a.id}" onclick="examChoose(${a.id})">${escapeHtml(t(a.answer_text))}</button>`
  ).join('');
  const nextLabel = (examIdx + 1 >= total) ? 'Показать результат' : 'Следующий вопрос →';

  main.innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="badge">📝 Экзамен</span>
        <span class="badge">${examIdx + 1} / ${total}</span>
        <span class="badge">верных: ${examCorrect}</span>
      </div>
      <div class="qtext">${escapeHtml(t(q.question_text))}</div>
      <div id="answers">${answersHtml}</div>
      <div class="explanation" id="expl"></div>
      <div class="controls">
        <button class="btn secondary" id="examBackBtn" onclick="examBack()" style="flex:0; min-width:110px;">← Назад</button>
        <button class="btn secondary" onclick="showStart()" style="flex:0; min-width:90px;">Выйти</button>
        <button class="btn" id="examNextBtn" onclick="examNext()" style="display:none;">${nextLabel}</button>
      </div>
    </div>`;

  if (chosen !== undefined) restoreAnswered(q, chosen);

  const backBtn = document.getElementById('examBackBtn');
  if (backBtn) backBtn.disabled = examIdx <= 0;
}

function examChoose(aid) {
  const q = current;
  if (examAnswers[q.question_id] !== undefined) return;
  examAnswers[q.question_id] = aid;
  const isCorrect = aid === q.correct_answer_id;
  if (isCorrect) examCorrect++;
  const p = progress[q.question_id] || { shown:0, correct:false, wrong:0 };
  p.shown++;
  p.ts = Date.now();
  if (isCorrect) p.correct = true; else { p.wrong++; p.correct = false; }
  progress[q.question_id] = p;
  saveProgress();

  // подсветить выбранный/правильный
  const correct = q.correct_answer_id;
  document.querySelectorAll('.answer').forEach(b => {
    b.disabled = true;
    const id = parseInt(b.dataset.id);
    if (id === correct) b.classList.add('correct');
    if (id === aid && aid !== correct) b.classList.add('wrong');
  });
  document.getElementById('stats').textContent =
    `📝 ${topicLabel()} · вопрос ${examIdx + 1} из ${examQueue.length} · верных: ${examCorrect}`;
  updateOverall();

  if (isCorrect) {
    // верно — сразу к следующему вопросу (короткая пауза, чтобы увидеть зелёную подсветку)
    setTimeout(() => { examNext(); }, 450);
  } else {
    // неверно — показать пояснение и кнопку «Дальше»
    const expl = document.getElementById('expl');
    expl.innerHTML = `<strong>❌ Неверно.</strong><br>${escapeHtml(t(q.answer_explanation))}`;
    expl.classList.add('show');
    document.getElementById('examNextBtn').style.display = '';
  }
}

function restoreAnswered(q, aid) {
  const correct = q.correct_answer_id;
  document.querySelectorAll('.answer').forEach(b => {
    b.disabled = true;
    const id = parseInt(b.dataset.id);
    if (id === correct) b.classList.add('correct');
    if (id === aid && aid !== correct) b.classList.add('wrong');
  });
  const isCorrect = aid === correct;
  const expl = document.getElementById('expl');
  expl.innerHTML = `<strong>${isCorrect ? '✅ Верно!' : '❌ Неверно.'}</strong><br>${escapeHtml(t(q.answer_explanation))}`;
  expl.classList.add('show');
  document.getElementById('examNextBtn').style.display = '';
}

function examNext() { examIdx++; renderExam(); }
function examBack() { if (examIdx > 0) { examIdx--; renderExam(); } }

/* ---------- История ответов ---------- */
// Список отвеченных вопросов текущей темы/подтемы, сортировка по времени последнего ответа (убыв.)
function buildHist() {
  document.getElementById('histTitle').textContent = 'История · ' + topicLabel();
  const listEl = document.getElementById('histList');
  // Отвеченные представители в текущей теме (есть запись в progress)
  const items = DATA.questions
    .filter(q => q.is_representative && inTopic(q) && progress[q.question_id])
    .map(q => ({ q, p: progress[q.question_id] }));
  // сортировка по ts убыв.; записи без ts — в конец
  items.sort((a, b) => (b.p.ts || 0) - (a.p.ts || 0));

  if (items.length === 0) {
    listEl.innerHTML = `<div class="hempty">В этой теме вы ещё не отвечали на вопросы.</div>`;
    return;
  }

  listEl.innerHTML = items.map(({ q, p }) => {
    const ok = !!p.correct;
    const when = p.ts ? new Date(p.ts).toLocaleString() : '—';
    return `<div class="hitem ${ok ? 'ok' : 'bad'}" onclick="openQuestion(${q.question_id})">
        <span class="st">${ok ? '✅' : '❌'}</span>
        <span>
          <div class="qt">${escapeHtml(t(q.question_text))}</div>
          <span class="gd">${q.question_guid} · ${when}${p.wrong ? ` · ошибок: ${p.wrong}` : ''}</span>
        </span>
      </div>`;
  }).join('');
}

function openHist() { buildHist(); document.getElementById('histOverlay').classList.add('show'); }
function closeHist() { document.getElementById('histOverlay').classList.remove('show'); }

// Просмотр отдельного вопроса (из истории): текст, все варианты с подсветкой верного, пояснение.
function openQuestion(qid) {
  const q = byId[qid];
  if (!q) return;
  closeHist();
  document.getElementById('startFooter').innerHTML = '';
  document.body.classList.remove('has-footer');
  const p = progress[qid] || {};
  const answersHtml = q.answers.map(a => {
    const isCorrect = a.id === q.correct_answer_id;
    return `<button class="answer ${isCorrect ? 'correct' : ''}" disabled>${isCorrect ? '✅ ' : ''}${escapeHtml(t(a.answer_text))}</button>`;
  }).join('');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('stats').textContent = 'Просмотр вопроса из истории';
  updateOverall();
  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="badge">${q.question_guid}</span>
        <span class="badge">${p.correct ? '✅ отвечали верно' : (p.wrong ? '❌ были ошибки' : '—')}</span>
      </div>
      <div class="qtext">${escapeHtml(t(q.question_text))}</div>
      <div id="answers">${answersHtml}</div>
      <div class="explanation show"><strong>Пояснение:</strong><br>${escapeHtml(t(q.answer_explanation))}</div>
      <div class="controls">
        <button class="btn secondary" onclick="openHist()" style="flex:0; min-width:130px;">← К истории</button>
        <button class="btn" onclick="showStart()">На главную</button>
      </div>
    </div>`;
}

function updateLangButtons() {
  document.querySelectorAll('#langSwitch .flag').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('#langSwitch .flag').forEach(b => {
  b.addEventListener('click', () => {
    lang = b.dataset.lang;
    localStorage.setItem('ppl_lang', lang);
    updateLangButtons();
    // перерисовать текущий экран
    if (examQueue.length && examIdx < examQueue.length) renderExam(); else showStart();
  });
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Сбросить весь прогресс?')) {
    progress = {}; saveProgress();
    examQueue = []; examIdx = 0; examCorrect = 0; examAnswers = {};
    showStart();
  }
});
document.getElementById('histBtn').addEventListener('click', openHist);
document.getElementById('closeHistBtn').addEventListener('click', closeHist);
document.getElementById('histOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'histOverlay') closeHist();
});

init();
</script>
</body>
</html>
